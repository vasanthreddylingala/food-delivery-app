# ==============================================================================
# Food Delivery Application - Services
# ==============================================================================

# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: food-delivery
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: backend

---

# Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: food-delivery
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: frontend
